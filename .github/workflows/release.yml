name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable goes to everyone (and beta); beta only to people who joined beta
        type: choice
        options: [stable, beta]
        default: stable
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead of a bump (optional)
        required: false
      notes:
        description: Release notes (optional; generated from the git log when empty)
        required: false

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      # vpk matches the velopack crate in Cargo.lock, as Velopack recommends.
      - name: Install vpk
        run: |
          $lock = Get-Content Cargo.lock -Raw
          $version = [regex]::Match($lock, 'name = "velopack"\r?\nversion = "([^"]+)"').Groups[1].Value
          dotnet tool install -g vpk --version $version
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      # The previous release lets vpk build a delta package and keep the full feed.
      - name: Download previous release
        if: inputs.channel == 'stable'
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir target/velopack-releases --token $env:GH_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}

      # Releases carry the beta feed too. Until one does there's nothing to download; any other
      # failure stops the release.
      - name: Download previous beta release
        run: |
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(any(.assets[]; .name == "releases.beta.json"))] | length'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($releases -eq "0") { "No release has a beta feed yet."; exit 0 }
          vpk download github --channel beta --pre --repoUrl "https://github.com/${{ github.repository }}" --outputDir target/velopack-releases --token $env:GH_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'win' }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $releaseArgs = @{ Channel = $env:CHANNEL; Bump = $env:BUMP; Publish = $true }
          if ($env:VERSION) { $releaseArgs.Version = $env:VERSION }
          if ($env:NOTES) { $releaseArgs.ReleaseNotes = $env:NOTES } else { $releaseArgs.UseGeneratedNotes = $true }
          ./scripts/release.ps1 @releaseArgs
