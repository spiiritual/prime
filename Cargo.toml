[package]
name = "prime"
version = "0.2.0"
edition = "2024"

[features]
default = []
image-viewer-testing = []

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
iced = { version = "0.14.0", features = ["advanced", "canvas", "image-without-codecs", "svg", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1.53.2", features = ["sync", "time"] }
tray-icon = { version = "0.26.0", default-features = false }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
velopack = "1.2.161"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

# Iced and wgpu draw too slowly unoptimized for animations to look smooth, so dev builds
# optimize dependencies; Prime's own code stays quick to rebuild and debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
