[package]
name = "prime"
version = "0.1.6"
edition = "2024"

[features]
default = []
image-viewer-testing = []
settings-cloning = []

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
flate2 = "1.1.10"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["time"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
velopack = "1.2.158"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
